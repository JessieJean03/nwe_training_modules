name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $v"

      - name: List dist contents
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem -Recurse dist } else { Write-Host 'No dist folder' }

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Training-Modules-Installer
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish / update GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
