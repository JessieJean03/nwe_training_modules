name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist contents (for debugging)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem -Recurse dist } else { Write-Host 'No dist folder produced' }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Training-Modules-Installer
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          retention-days: 30
          if-no-files-found: error
